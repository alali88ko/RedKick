<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZAZA TV — نتائج المباريات</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-0: #070b16;
      --bg-1: #0e1424;
      --bg-2: #151c30;
      --bg-3: #1d2540;
      --bg-4: #283356;
      --accent: #22c55e;
      --accent-2: #10b981;
      --accent-glow: rgba(34, 197, 94, 0.4);
      --gold: #fbbf24;
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.5);
      --text: #f8fafc;
      --text-2: #cbd5e1;
      --text-3: #64748b;
      --border: #2a3450;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-0);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(34,197,94,0.10), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(16,185,129,0.07), transparent 40%);
      pointer-events: none; z-index: 0;
    }

    /* ===== تأثيرات الخلفية المتحركة ===== */
    .bg-effects {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden;
    }
    /* كرات ضوئية متحركة */
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(60px); opacity: 0.5;
      animation: floatOrb 20s infinite ease-in-out;
    }
    .bg-orb:nth-child(1) {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(34,197,94,0.4), transparent 70%);
      top: -100px; right: -100px;
      animation-delay: 0s;
    }
    .bg-orb:nth-child(2) {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(16,185,129,0.35), transparent 70%);
      bottom: -80px; left: -80px;
      animation-delay: -7s;
    }
    .bg-orb:nth-child(3) {
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(34,197,94,0.25), transparent 70%);
      top: 50%; left: 50%;
      animation-delay: -14s;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(60px, -40px) scale(1.1); }
      50% { transform: translate(-40px, 50px) scale(0.95); }
      75% { transform: translate(40px, 40px) scale(1.05); }
    }

    /* جسيمات صغيرة متحركة */
    .bg-particle {
      position: absolute; width: 4px; height: 4px;
      background: var(--accent); border-radius: 50%;
      opacity: 0.6;
      animation: riseUp linear infinite;
    }
    @keyframes riseUp {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    /* ===== الهيدر ===== */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(7, 11, 22, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 14px 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; position: relative;
    }
    /* خطوط القائمة (هامبرغر) في الأعلى يسار اللوغو */
    .menu-toggle {
      position: absolute; top: 18px; left: 18px;
      width: 36px; height: 36px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 5px; cursor: pointer;
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .menu-toggle:hover { background: var(--bg-4); border-color: var(--accent); }
    .menu-toggle span {
      display: block; width: 18px; height: 2px;
      background: var(--text); border-radius: 1px;
      transition: all 0.2s;
    }

    /* ===== القائمة المنسدلة للتواصل ===== */
    .contact-menu {
      position: absolute; top: 60px; left: 18px;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none; flex-direction: column; gap: 6px;
      min-width: 220px; z-index: 200;
      animation: slideDown 0.25s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .contact-menu.show { display: flex; }
    .contact-menu-title {
      font-size: 0.74rem; color: var(--text-3); font-weight: 700;
      padding: 4px 10px; border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .contact-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      text-decoration: none; color: var(--text);
      font-weight: 700; font-size: 0.85rem;
      transition: all 0.2s;
    }
    .contact-link:hover { background: var(--bg-3); transform: translateX(-3px); }
    .contact-link.whatsapp:hover { background: rgba(37, 211, 102, 0.15); color: #25d366; }
    .contact-link.instagram:hover { background: rgba(228, 64, 95, 0.15); color: #e4405f; }
    .contact-link .icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .contact-link .icon svg {
      width: 22px; height: 22px;
      display: block;
    }
    .contact-link.whatsapp .icon { background: rgba(37, 211, 102, 0.15); }
    .contact-link.instagram .icon { background: rgba(228, 64, 95, 0.15); }
    .contact-link.whatsapp .icon svg { fill: #25d366; }
    .contact-link.instagram .icon svg { fill: #e4405f; }
    .contact-link .info { display: flex; flex-direction: column; gap: 1px; }
    .contact-link .label { font-size: 0.78rem; color: var(--text-3); font-weight: 600; }
    .contact-link .value { font-size: 0.88rem; direction: ltr; }
    .logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .logo-image {
      width: 64px; height: 64px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--accent);
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 0.3s;
    }
    .logo-image:hover { transform: scale(1.05); }
    .logo-text { font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }
    .logo-text .zaza { color: var(--accent); }
    .logo-text .tv { color: var(--text); }
    .header-status { display: flex; align-items: center; gap: 8px; }
    .live-indicator {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--red); color: white;
      padding: 4px 10px; border-radius: 14px;
      font-size: 0.72rem; font-weight: 700;
    }
    .live-indicator::before {
      content: ''; width: 6px; height: 6px; background: white;
      border-radius: 50%; animation: pulse 1.4s infinite;
    }
    /* زر التحديث مخفي لكنه يعمل تلقائياً */
    .btn-refresh { display: none; }
    .last-update { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ===== المحتوى ===== */
    main {
      max-width: 1200px; margin: 0 auto;
      padding: 18px 24px;
      position: relative; z-index: 1;
    }

    /* ===== التبويبات الرئيسية - مصغّرة ومتمركزة ===== */
    .main-tabs {
      display: flex; justify-content: center; align-items: stretch; gap: 3px;
      background: var(--bg-2);
      padding: 4px; border-radius: 10px; margin: 0 auto 18px;
      border: 1px solid var(--border);
      width: fit-content; max-width: 100%;
      margin-left: auto; margin-right: auto;
    }
    .main-tab {
      background: transparent; border: none; color: var(--text-2);
      padding: 8px 24px; border-radius: 7px; cursor: pointer;
      font-family: inherit; font-weight: 700; font-size: 0.85rem; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      min-width: 90px; text-align: center;
    }
    .main-tab:hover { color: var(--text); background: var(--bg-3); }
    .main-tab.active { background: var(--accent); color: white; box-shadow: 0 2px 10px var(--accent-glow); }
    .main-tab.live-tab.active { background: var(--red); box-shadow: 0 2px 10px var(--red-glow); }

    .matches-container { display: flex; flex-direction: column; gap: 10px; }

    /* ===== تجميع الأيام ===== */
    .day-group { margin-bottom: 14px; }
    .day-header {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; margin-bottom: 8px;
      color: var(--gold); font-weight: 800; font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
    }
    .day-header .day-count {
      background: var(--bg-4); color: var(--text-2);
      padding: 1px 8px; border-radius: 8px;
      font-size: 0.7rem; font-weight: 700;
    }

    /* ===== بطاقة المباراة - أكثر ترتيباً ===== */
    .match-card {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      transition: all 0.2s; position: relative; overflow: hidden;
    }
    .match-card:hover { border-color: var(--accent); }
    .match-card.live { border-color: var(--red); }
    .match-card.live::before {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 3px;
      background: var(--red); animation: livePulse 1.4s infinite;
    }
    @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .match-card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: 0.72rem;
    }
    .match-card-league { color: var(--gold); font-weight: 700; font-size: 0.74rem; }
    .match-card-status {
      font-weight: 700; padding: 2px 9px; border-radius: 8px; font-size: 0.68rem;
    }
    .status-live { background: var(--red); color: white; display: inline-flex; align-items: center; gap: 4px; }
    .status-live::before {
      content: ''; width: 5px; height: 5px; background: white;
      border-radius: 50%; animation: pulse 1.4s infinite;
    }
    .status-scheduled { background: var(--bg-4); color: var(--text-2); }
    .status-finished { background: var(--bg-4); color: var(--text-3); }

    .match-card-body {
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 12px; align-items: center;
    }
    .team-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .team-row.away { flex-direction: row-reverse; text-align: left; }
    .team-row.home { text-align: right; }
    .team-logo {
      width: 36px; height: 36px; object-fit: contain;
      flex-shrink: 0; border-radius: 6px;
      background: var(--bg-1); padding: 2px;
    }
    .team-placeholder {
      width: 36px; height: 36px; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 1.2rem; background: var(--bg-3); border-radius: 6px;
    }
    .team-name {
      font-weight: 700; font-size: 0.92rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-box {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-1); padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      min-width: 80px; justify-content: center;
    }
    .score-number {
      font-size: 1.4rem; font-weight: 900; color: var(--text);
      min-width: 28px; text-align: center;
    }
    .score-number.winner { color: var(--accent); }
    .score-separator { color: var(--text-3); font-size: 1rem; font-weight: 700; }
    .score-vs { color: var(--text-3); font-size: 0.72rem; font-weight: 700; }

    /* ===== زر التفاصيل - صغير وأنيق ===== */
    .match-actions {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: center; gap: 8px;
    }
    .btn-details {
      background: var(--bg-1); border: 1px solid var(--border);
      color: var(--text-2); padding: 5px 14px; border-radius: 7px;
      cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.74rem;
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-details:hover { background: var(--bg-4); border-color: var(--accent); color: var(--accent); }
    .btn-details.expanded { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-details .arrow { transition: transform 0.2s; display: inline-block; }
    .btn-details.expanded .arrow { transform: rotate(180deg); }

    /* ===== تفاصيل الأهداف (مخفية افتراضياً) ===== */
    .match-details {
      display: none;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .match-details.show { display: block; }
    .details-loading {
      text-align: center; color: var(--text-3); font-size: 0.78rem; padding: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .mini-spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--bg-4); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .goals-list { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; }
    .goal-item {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 8px; border-radius: 6px;
    }
    .goal-item:hover { background: var(--bg-1); }
    .goal-item .goal-minute {
      background: var(--bg-4); color: var(--accent);
      padding: 1px 7px; border-radius: 6px;
      font-size: 0.68rem; font-weight: 700;
      min-width: 32px; text-align: center;
    }
    .goal-item .goal-text { color: var(--text-2); flex: 1; font-weight: 600; }
    .goal-item .goal-team { color: var(--text-3); font-size: 0.7rem; }
    .no-details {
      text-align: center; color: var(--text-3); font-size: 0.78rem; padding: 8px;
    }

    .empty-state {
      text-align: center; color: var(--text-3); padding: 50px 20px;
      font-size: 0.95rem;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

    .loading-state {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 50px 20px; color: var(--text-3); font-size: 0.88rem;
    }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--bg-3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }

    .toast {
      position: fixed; bottom: 20px; right: 50%;
      transform: translateX(50%) translateY(100px);
      background: var(--bg-3); border: 1px solid var(--accent);
      color: var(--text); padding: 10px 20px; border-radius: 10px;
      box-shadow: var(--shadow); z-index: 1000;
      font-weight: 600; font-size: 0.82rem;
      transition: transform 0.4s, opacity 0.4s; opacity: 0;
      max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translateX(50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--red); }

    footer { text-align: center; padding: 18px; color: var(--text-3); font-size: 0.76rem; border-top: 1px solid var(--border); margin-top: 20px; }

    @media (max-width: 700px) {
      .header-inner { padding: 10px 14px; }
      main { padding: 14px; }
      .logo { font-size: 1rem; }
      .logo-icon { width: 34px; height: 34px; }
      .main-tab { padding: 7px 12px; font-size: 0.78rem; }
      .team-logo, .team-placeholder { width: 30px; height: 30px; }
      .team-name { font-size: 0.82rem; }
      .score-number { font-size: 1.2rem; }
      .score-box { min-width: 64px; padding: 5px 9px; }
      .match-card { padding: 12px; }
      .match-card-body { gap: 8px; }
    }
  </style>
</head>

    'Dortmund': 'دورتموند', 'RB Leipzig': 'لايبزيغ', 'Bayer Leverkusen': 'ليفركوزن',
    'Eintracht Frankfurt': 'آينتراخت فرانكفورت', 'VfB Stuttgart': 'شتوتغارت',
    'Stuttgart': 'شتوتغارت', 'Freiburg': 'فرايبورغ', 'Wolfsburg': 'فولفسبورغ',
    'Mainz 05': 'ماينتس', 'Borussia M.Gladbach': 'مونشنغلادباخ',
    'Werder Bremen': 'فيردر بريمن', 'Hoffenheim': 'هوفنهايم',
    'Augsburg': 'آوغسبورغ', 'Union Berlin': 'يونيون برلين', 'VfL Bochum': 'بوخوم',
    'Heidenheim': 'هايدينهايم', 'Holstein Kiel': 'هولشتاين كيل', 'St. Pauli': 'سانت باولي'
  };

  function translateTeamName(name) {
    if (!name) return '—';
    if (TEAM_NAMES_AR[name]) return TEAM_NAMES_AR[name];
    for (const en in TEAM_NAMES_AR) {
      if (name.includes(en)) return TEAM_NAMES_AR[en];
    }
    return name;
  }

  /* ====================================================================
     🎮  منطق التطبيق
  ===================================================================== */
  const $ = id => document.getElementById(id);
  const matchesContainer = $('matches-container');
  const toast = $('toast');
  const refreshBtn = $('refresh-btn');
  const lastUpdateText = $('last-update-text');
  const liveIndicator = $('live-indicator');

  let allMatches = [];
  let activeTab = 'results';
  // ذاكرة تفاصيل كل مباراة (مفتوحة أم لا + الأهداف)
  const matchState = new Map(); // matchId -> { expanded, goals, loading, loaded }
  const matchGoalsCache = new Map(); // matchId -> { goals, timestamp }

  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  /* --- أدوات التاريخ --- */
  function formatDateESPN(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}${m}${d}`;
  }
  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }
  function formatDateLabel(dateStr) {
    if (!dateStr) return '';
    const y = dateStr.slice(0, 4);
    const m = dateStr.slice(4, 6);
    const d = dateStr.slice(6, 8);
    const date = new Date(`${y}-${m}-${d}T00:00:00`);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const target = new Date(date); target.setHours(0, 0, 0, 0);
    const diffDays = Math.round((today - target) / 86400000);
    if (diffDays === 0) return 'اليوم';
    if (diffDays === -1) return 'غداً';
    if (diffDays === 1) return 'أمس';
    if (diffDays === 2) return 'قبل يومين';
    if (diffDays > 0 && diffDays <= 7) return `قبل ${diffDays} أيام`;
    if (diffDays < 0 && diffDays >= -7) return `بعد ${Math.abs(diffDays)} ${Math.abs(diffDays) === 1 ? 'يوم' : 'أيام'}`;
    const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    return `${days[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
  }

  function isLive(m) { return m.status?.type?.state === 'in'; }
  function isFinished(m) { return m.status?.type?.state === 'post'; }
  function isScheduled(m) { return m.status?.type?.state === 'pre'; }

  /* --- جلب مباريات بطولة --- */
  async function fetchLeagueMatches(leagueKey, dateStart, dateEnd) {
    const dateRange = `${formatDateESPN(dateStart)}-${formatDateESPN(dateEnd)}`;
    const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueKey}/scoreboard?dates=${dateRange}`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Network');
      const data = await res.json();
      return (data.events || []).map(e => ({
        ...e,
        _leagueKey: leagueKey,
        _leagueName: LEAGUES[leagueKey].name,
        _leagueShort: LEAGUES[leagueKey].short
      }));
    } catch (err) {
      console.warn(`fetchLeagueMatches ${leagueKey}:`, err);
      return [];
    }
  }

  /* --- جلب أهداف مباراة --- */
  async function fetchMatchGoals(matchId, leagueKey) {
    const cached = matchGoalsCache.get(matchId);
    if (cached && (Date.now() - cached.timestamp) < 60000) {
      return cached.goals;
    }
    try {
      const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueKey}/summary?event=${matchId}`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      const keyEvents = data.keyEvents || [];
      const goals = keyEvents
        .filter(e => e.scoringPlay === true)
        .map(e => {
          const athlete = e.participants?.[0]?.athlete?.displayName || 'لاعب';
          const minute = e.clock?.displayValue || '';
          const teamName = translateTeamName(e.team?.displayName || '');
          const shortText = e.shortText || '';
          return {
            minute,
            athlete,
            team: teamName,
            text: shortText,
            teamId: e.team?.id
          };
        });
      matchGoalsCache.set(matchId, { goals, timestamp: Date.now() });
      return goals;
    } catch (e) {
      return [];
    }
  }

  /* --- جلب كل المباريات --- */
  async function fetchAllMatches() {
    refreshBtn.classList.add('loading');
    try {
      const today = new Date();
      const startDate = addDays(today, -7);
      const endDate = addDays(today, 7);

      const promises = Object.keys(LEAGUES).map(key => fetchLeagueMatches(key, startDate, endDate));
      const results = await Promise.all(promises);

      let matches = [];
      results.forEach(r => matches.push(...r));

      const seen = new Set();
      matches = matches.filter(m => {
        const key = m.id || (m.name + (m.date || ''));
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      matches.sort((a, b) => {
        const aLive = isLive(a);
        const bLive = isLive(b);
        if (aLive && !bLive) return -1;
        if (!aLive && bLive) return 1;
        return new Date(a.date || 0) - new Date(b.date || 0);
      });

      allMatches = matches;
      lastUpdateText.textContent = `آخر تحديث: ${new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
      updateCounts();
      renderMatches();
    } catch (err) {
      console.error(err);
      matchesContainer.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>فشل جلب المباريات. تأكد من الإنترنت.</div>`;
      showToast('فشل تحديث المباريات', true);
    } finally {
      refreshBtn.classList.remove('loading');
    }
  }

  function updateCounts() {
    const today = new Date(); today.setHours(0,0,0,0);
    const yesterday = addDays(today, -1);
    const tomorrow = addDays(today, 1);

    let resultsCount = 0, liveCount = 0, upcomingCount = 0;
    allMatches.forEach(m => {
      const matchDate = m.date ? new Date(m.date) : null;
      if (matchDate) matchDate.setHours(0,0,0,0);
      if (isLive(m)) liveCount++;
      if (isFinished(m)) {
        if (matchDate && matchDate <= yesterday) resultsCount++;
        else if (matchDate && matchDate.getTime() === today.getTime()) resultsCount++;
      }
      if (isScheduled(m)) {
        if (matchDate && matchDate >= tomorrow) upcomingCount++;
        else if (matchDate && matchDate.getTime() === today.getTime()) upcomingCount++;
      }
    });
    // الأرقام لم تعد تظهر في التبويبات - نكتفي بتحديث مؤشر "مباشر الآن"
    liveIndicator.style.display = liveCount > 0 ? 'inline-flex' : 'none';
  }

  function getTeamInfo(competition, side) {
    if (!competition) return { name: '—', logo: '', score: null, winner: false, id: null };
    const competitors = competition.competitors || [];
    const team = competitors.find(c => c.homeAway === side);
    if (!team) return { name: '—', logo: '', score: null, winner: false, id: null };
    const displayName = team.team?.displayName || team.team?.name || '—';
    return {
      name: translateTeamName(displayName),
      logo: team.team?.logo || team.team?.logoHref || '',
      score: team.score,
      winner: team.winner === true,
      id: team.team?.id || team.id
    };
  }

  function formatMatchTime(match) {
    if (!match.date) return '—';
    const d = new Date(match.date);
    const state = match.status?.type?.state;
    if (state === 'in') {
      const clock = match.status?.displayClock || match.status?.type?.shortDetail || '';
      return clock || 'مباشر';
    }
    if (state === 'post') {
      return match.status?.type?.shortDetail || 'انتهت';
    }
    return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  /* --- عرض المباريات --- */
  function renderMatches() {
    if (allMatches.length === 0) {
      matchesContainer.innerHTML = '<div class="empty-state"><div class="icon">⚽</div>لا توجد مباريات</div>';
      return;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const yesterday = addDays(today, -1);
    const tomorrow = addDays(today, 1);

    let filtered = allMatches.filter(m => {
      const matchDate = m.date ? new Date(m.date) : null;
      if (matchDate) matchDate.setHours(0,0,0,0);
      if (activeTab === 'live') return isLive(m);
      if (activeTab === 'results') {
        if (!isFinished(m)) return false;
        if (matchDate && matchDate <= yesterday) return true;
        if (matchDate && matchDate.getTime() === today.getTime()) return true;
        return false;
      }
      if (activeTab === 'upcoming') {
        if (!isScheduled(m)) return false;
        if (matchDate && matchDate >= tomorrow) return true;
        if (matchDate && matchDate.getTime() === today.getTime()) return true;
        return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      const msgs = {
        results: 'لا توجد نتائج متاحة حالياً',
        live: 'لا توجد مباريات مباشرة الآن',
        upcoming: 'لا توجد مباريات قادمة'
      };
      matchesContainer.innerHTML = `<div class="empty-state"><div class="icon">⚽</div>${msgs[activeTab]}</div>`;
      return;
    }

    const grouped = {};
    filtered.forEach(m => {
      const dateKey = m.date ? m.date.slice(0, 10).replace(/-/g, '') : 'unknown';
      if (!grouped[dateKey]) grouped[dateKey] = [];
      grouped[dateKey].push(m);
    });

    let sortedDays;
    if (activeTab === 'results') {
      sortedDays = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
    } else {
      sortedDays = Object.keys(grouped).sort((a, b) => a.localeCompare(b));
    }

    const fragment = document.createDocumentFragment();
    sortedDays.forEach(dateKey => {
      const dayMatches = grouped[dateKey];
      const dateLabel = formatDateLabel(dateKey);

      const dayGroup = document.createElement('div');
      dayGroup.className = 'day-group';
      dayGroup.innerHTML = `
        <div class="day-header">
          <span>📅 ${dateLabel}</span>
          <span class="day-count">${dayMatches.length} مباراة</span>
        </div>
      `;

      dayMatches.forEach(m => {
        const card = createMatchCard(m);
        dayGroup.appendChild(card);
      });

      fragment.appendChild(dayGroup);
    });

    matchesContainer.innerHTML = '';
    matchesContainer.appendChild(fragment);
  }

  /* --- إنشاء بطاقة مباراة --- */
  function createMatchCard(m) {
    const competition = m.competitions && m.competitions[0];
    const home = getTeamInfo(competition, 'home');
    const away = getTeamInfo(competition, 'away');
    const live = isLive(m);
    const finished = isFinished(m);
    const matchId = m.id;

    // استرجاع الحالة المحفوظة (مفتوحة أم لا)
    const state = matchState.get(matchId) || { expanded: false };
    const showDetailsButton = live || finished;

    const homeLogo = home.logo
      ? `<img src="${home.logo}" alt="" class="team-logo" onerror="this.outerHTML='<span class=\\'team-placeholder\\'>⚽</span>'">`
      : `<span class="team-placeholder">⚽</span>`;
    const awayLogo = away.logo
      ? `<img src="${away.logo}" alt="" class="team-logo" onerror="this.outerHTML='<span class=\\'team-placeholder\\'>⚽</span>'">`
      : `<span class="team-placeholder">⚽</span>`;

    let statusBadge;
    if (live) {
      statusBadge = `<span class="match-card-status status-live">${formatMatchTime(m)}</span>`;
    } else if (finished) {
      statusBadge = `<span class="match-card-status status-finished">${formatMatchTime(m)}</span>`;
    } else {
      statusBadge = `<span class="match-card-status status-scheduled">${formatMatchTime(m)}</span>`;
    }

    let scoreDisplay;
    if (live || finished) {
      const homeWin = home.winner === true;
      const awayWin = away.winner === true;
      scoreDisplay = `
        <div class="score-box">
          <span class="score-number ${homeWin ? 'winner' : ''}">${home.score ?? 0}</span>
          <span class="score-separator">-</span>
          <span class="score-number ${awayWin ? 'winner' : ''}">${away.score ?? 0}</span>
        </div>
      `;
    } else {
      scoreDisplay = `<div class="score-box"><span class="score-vs">ضد</span></div>`;
    }

    // زر التفاصيل يظهر فقط للمباريات المباشرة والمنتهية
    const detailsButton = showDetailsButton ? `
      <div class="match-actions">
        <button class="btn-details ${state.expanded ? 'expanded' : ''}" data-match-id="${matchId}">
          <span>التفاصيل والأهداف</span>
          <span class="arrow">▼</span>
        </button>
      </div>
    ` : '';

    // تفاصيل الأهداف تظهر فقط إذا كانت مفتوحة
    const detailsHtml = state.expanded ? `
      <div class="match-details show" data-match-id="${matchId}">
        <div class="details-loading">
          <div class="mini-spinner"></div>
          <div>جاري تحميل الأهداف...</div>
        </div>
      </div>
    ` : `<div class="match-details" data-match-id="${matchId}"></div>`;

    const card = document.createElement('div');
    card.className = 'match-card' + (live ? ' live' : '');
    card.setAttribute('data-id', matchId);
    card.innerHTML = `
      <div class="match-card-top">
        <span class="match-card-league">${m._leagueShort}</span>
        ${statusBadge}
      </div>
      <div class="match-card-body">
        <div class="team-row home">
          ${homeLogo}
          <span class="team-name">${home.name}</span>
        </div>
        ${scoreDisplay}
        <div class="team-row away">
          ${awayLogo}
          <span class="team-name">${away.name}</span>
        </div>
      </div>
      ${detailsButton}
      ${detailsHtml}
    `;

    // ربط زر التفاصيل
    const btn = card.querySelector('.btn-details');
    if (btn) {
      btn.addEventListener('click', () => toggleDetails(matchId, m, home, away));
      // إذا كانت مفتوحة، حمّل الأهداف فوراً
      if (state.expanded) {
        loadGoalsIntoCard(matchId, m, home, away);
      }
    }

    return card;
  }

  /* --- فتح/إغلاق تفاصيل المباراة --- */
  function toggleDetails(matchId, match, home, away) {
    const state = matchState.get(matchId) || { expanded: false };
    state.expanded = !state.expanded;
    matchState.set(matchId, state);

    const btn = document.querySelector(`.btn-details[data-match-id="${matchId}"]`);
    const detailsDiv = document.querySelector(`.match-details[data-match-id="${matchId}"]`);

    if (btn) btn.classList.toggle('expanded', state.expanded);
    if (!detailsDiv) return;

    if (state.expanded) {
      detailsDiv.classList.add('show');
      detailsDiv.innerHTML = `
        <div class="details-loading">
          <div class="mini-spinner"></div>
          <div>جاري تحميل الأهداف...</div>
        </div>
      `;
      loadGoalsIntoCard(matchId, match, home, away);
    } else {
      detailsDiv.classList.remove('show');
    }
  }

  /* --- تحميل الأهداف داخل بطاقة --- */
  async function loadGoalsIntoCard(matchId, match, home, away) {
    const detailsDiv = document.querySelector(`.match-details[data-match-id="${matchId}"]`);
    if (!detailsDiv) return;

    const goals = await fetchMatchGoals(matchId, match._leagueKey);

    if (goals.length === 0) {
      detailsDiv.innerHTML = `<div class="no-details">لا توجد أهداف مسجلة</div>`;
      return;
    }

    detailsDiv.innerHTML = `
      <div class="goals-list">
        ${goals.map(g => {
          const teamLabel = g.teamId === home.id ? home.name : (g.teamId === away.id ? away.name : g.team);
          return `
            <div class="goal-item">
              <span class="goal-minute">⚽ ${g.minute}</span>
              <span class="goal-text">${g.athlete}</span>
              <span class="goal-team">${teamLabel}</span>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  /* --- الأحداث --- */
  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.getAttribute('data-tab');
      renderMatches();
    });
  });

  refreshBtn.addEventListener('click', fetchAllMatches);

  /* --- قائمة التواصل: فتح/إغلاق عند الضغط على الخطوط الثلاثة --- */
  const menuToggle = $('menu-toggle');
  const contactMenu = $('contact-menu');
  menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    contactMenu.classList.toggle('show');
  });
  // إغلاق القائمة عند النقر خارجها
  document.addEventListener('click', (e) => {
    if (!contactMenu.contains(e.target) && !menuToggle.contains(e.target)) {
      contactMenu.classList.remove('show');
    }
  });

  /* --- توليد جسيمات الخلفية المتحركة --- */
  function createParticles() {
    const container = $('particles-container');
    if (!container) return;
    const count = 20;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'bg-particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (15 + Math.random() * 15) + 's';
      p.style.animationDelay = (Math.random() * -20) + 's';
      const size = 2 + Math.random() * 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      // تنويع الألوان قليلاً
      if (Math.random() > 0.5) {
        p.style.background = 'var(--accent-2)';
      }
      container.appendChild(p);
    }
  }
  createParticles();

  /* --- التهيئة + التحديث التلقائي --- */
  fetchAllMatches();

  // تحديث كل 30 ثانية دائماً (يكشف بداية المباريات الجديدة + تحديث النتائج المباشرة + الأهداف)
  setInterval(async () => {
    await fetchAllMatches();
    // تحديث الأهداف للبطاقات المفتوحة فقط (إذا كانت هناك مباراة مباشرة)
    const hasLive = allMatches.some(isLive);
    if (hasLive) {
      document.querySelectorAll('.match-details.show').forEach(div => {
        const matchId = div.getAttribute('data-match-id');
        const match = allMatches.find(m => m.id === matchId);
        if (match) {
          const competition = match.competitions && match.competitions[0];
          const home = getTeamInfo(competition, 'home');
          const away = getTeamInfo(competition, 'away');
          matchGoalsCache.delete(matchId); // إجبار التحديث
          loadGoalsIntoCard(matchId, match, home, away);
        }
      });
    }
  }, LIVE_REFRESH);

  // تحديث كامل كل دقيقة (نسخة احتياطية)
  setInterval(fetchAllMatches, FULL_REFRESH);
  </script>
</body>
</html>
