<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedKick</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #080404;
            --fg: #f0e6e6;
            --muted: #6b4a4a;
            --accent: #FF2D2D;
            --accent2: #FF6B1A;
            --accent3: #FFB800;
            --card: rgba(18,8,8,0.95);
            --border: rgba(255,45,45,0.12);
            --danger: #ff3b3b;
            --success: #00c853;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--fg); font-family: 'Tajawal', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #fireCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(8,4,4,0.7) 70%, rgba(8,4,4,0.95) 100%); pointer-events: none; z-index: 1; }
        .bg-glow { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; filter: blur(120px); }
        .bg-glow.g1 { width: 500px; height: 500px; top: -150px; left: -100px; background: rgba(255,45,45,0.06); animation: gd1 14s ease-in-out infinite; }
        .bg-glow.g2 { width: 400px; height: 400px; bottom: -100px; right: -80px; background: rgba(255,107,26,0.05); animation: gd2 18s ease-in-out infinite; }
        .bg-glow.g3 { width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(255,184,0,0.03); animation: gd3 10s ease-in-out infinite; }
        @keyframes gd1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
        @keyframes gd2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-30px)}}
        @keyframes gd3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 24px;
            padding: 36px 32px; width: 100%; max-width: 480px; position: relative; z-index: 10;
            box-shadow: 0 0 80px rgba(255,45,45,0.04), 0 0 160px rgba(255,45,45,0.02), inset 0 1px 0 rgba(255,255,255,0.02);
        }
        .logo-wrap { text-align: center; margin-bottom: 32px; }
        .logo-img {
            width: 96px; height: 96px; border-radius: 22px; object-fit: cover; display: inline-block;
            box-shadow: 0 0 40px rgba(255,45,45,0.25), 0 0 80px rgba(255,45,45,0.1), 0 4px 20px rgba(0,0,0,0.5);
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,100% { box-shadow: 0 0 40px rgba(255,45,45,0.25), 0 0 80px rgba(255,45,45,0.1), 0 4px 20px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 60px rgba(255,45,45,0.35), 0 0 120px rgba(255,45,45,0.15), 0 4px 20px rgba(0,0,0,0.5); }
        }
        .app-name {
            font-size: 38px; font-weight: 900; letter-spacing: -1px; margin-top: 16px;
            background: linear-gradient(135deg, #FF2D2D 0%, #FF6B1A 50%, #FFB800 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .app-tagline { font-size: 13px; color: var(--muted); margin-top: 4px; }
        label { display: block; font-size: 13px; font-weight: 700; color: var(--fg); margin-bottom: 6px; }
        .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
        input, textarea, select {
            width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,45,45,0.1); border-radius: 12px; color: var(--fg);
            font-size: 14px; font-family: inherit; outline: none; transition: border .25s, box-shadow .25s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,45,45,0.08), 0 0 24px rgba(255,45,45,0.06); }
        input::placeholder, textarea::placeholder { color: #4a3030; }
        textarea { resize: vertical; min-height: 100px; line-height: 1.8; }
        select option { background: #1a0a0a; color: var(--fg); }
        .row { display: flex; gap: 8px; }
        .row input { flex: 1; }
        .btn {
            padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer;
            font-weight: 700; font-size: 14px; font-family: inherit; transition: all .2s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
        .btn-fire { background: linear-gradient(135deg, #FF2D2D, #FF6B1A); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-fire:hover:not(:disabled) { background: linear-gradient(135deg, #ff4040, #ff8030); box-shadow: 0 0 30px rgba(255,45,45,0.3), 0 0 60px rgba(255,107,26,0.15); transform: translateY(-1px); }
        .btn-stop { background: linear-gradient(135deg, #cc0000, #990000); color: #fff; }
        .btn-stop:hover { box-shadow: 0 0 24px rgba(204,0,0,0.3); }
        .btn-ghost { background: rgba(255,255,255,0.03); color: var(--fg); border: 1px solid var(--border); }
        .btn-ghost:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,45,45,0.25); }
        .btn-sm { padding: 10px 16px; font-size: 13px; }
        .btn-full { width: 100%; justify-content: center; }
        .field { margin-bottom: 18px; }
        .account-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; background: rgba(255,45,45,0.04); border: 1px solid var(--border);
            border-radius: 12px; margin-bottom: 18px;
        }
        .account-bar .name { font-weight: 700; color: var(--accent); font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
        .dot-sending { animation: blink 1s infinite; }
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .progress-wrap { margin-bottom: 18px; }
        .progress-track { height: 4px; background: rgba(255,255,255,0.04); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); border-radius: 2px; transition: width .3s; width: 0; }
        .progress-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
        .phase { display: none; }
        .phase.active { display: block; animation: fadeIn .4s ease; }
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,45,45,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px; }
        @keyframes spin{to{transform:rotate(360deg)}}
        .spinner-sm { width: 14px; height: 14px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; }
        .toast-box { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .toast { padding: 10px 22px; border-radius: 10px; font-weight: 700; font-size: 13px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); animation: toastIn .3s ease; font-family: inherit; max-width: 90vw; }
        .toast-s { background: linear-gradient(135deg, #FF2D2D, #FF6B1A); color: #fff; }
        .toast-e { background: rgba(200,0,0,0.92); color: #fff; }
        .toast-i { background: rgba(255,184,0,0.92); color: #000; }
        @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .log-section { display: none !important; }
        .fire-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,45,45,0.2), rgba(255,107,26,0.3), rgba(255,45,45,0.2), transparent); margin: 20px 0; }
        .proxy-bar { display: none !important; }
        .mode-badge {
            display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
            border-radius: 20px; font-size: 10px; font-weight: 700;
        }
        .mode-direct { background: rgba(0,200,80,0.12); color: var(--success); border: 1px solid rgba(0,200,80,0.2); }
        .mode-proxy { background: rgba(255,184,0,0.12); color: var(--accent3); border: 1px solid rgba(255,184,0,0.2); }
        @media(max-width:560px){.card{margin:12px;padding:24px 20px;border-radius:18px}.logo-img{width:72px;height:72px}.app-name{font-size:30px}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>
<body>

<canvas id="fireCanvas"></canvas>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>
<div class="bg-glow g3"></div>
<div class="bg-vignette"></div>
<div class="toast-box" id="toasts"></div>

<div class="card" id="app">

    <!-- تحميل -->
    <div class="phase active" id="ph-load">
        <div class="spinner"></div>
        <p style="text-align:center;color:var(--muted);font-size:14px">جارٍ الاتصال بخوادم Kick...</p>
    </div>

    <!-- إدخال التوكن -->
    <div class="phase" id="ph-token">
        <div class="logo-wrap">
            <img src="https://z-cdn-media.chatglm.cn/files/ab46995c-be54-4f0c-97d9-dc9965e3150b.png?auth_key=1881547846-5faaad2376f94647ae1522c3a0360a5e-0-48bb8eb6d9136f1963f04a687018a6a3" alt="RedKick" class="logo-img">
            <div class="app-name">RedKick</div>
            <div class="app-tagline">التحكم عن بُعد في الدردشة</div>
        </div>
        <div class="fire-divider"></div>
        <div class="proxy-bar" id="proxyBarToken">
            <span class="dot-proxy wait" id="proxyDotToken"></span>
            <span id="proxyLabelToken">جارٍ فحص الاتصال...</span>
            <select id="proxySelect" style="margin-right:auto" onchange="switchProxy()">
                <option value="0">cors.sh</option>
                <option value="1">بدون بروكسي (مباشر)</option>
            </select>
        </div>
        <div class="field">
            <label><i class="fas fa-key" style="color:var(--accent);margin-left:4px;font-size:11px"></i> توكن الحساب</label>
            <div class="row">
                <input type="password" id="inToken" placeholder="Bearer Token...">
                <button class="btn btn-fire btn-sm" id="btnVerify" onclick="verifyToken()"><i class="fas fa-shield-halved"></i> فحص</button>
            </div>
            <p class="hint">من DevTools &rarr; Network &rarr; أي طلب &rarr; Authorization</p>
        </div>
        <div id="tokenStatus" style="text-align:center;font-size:13px;min-height:20px"></div>
    </div>

    <!-- لوحة التحكم -->
    <div class="phase" id="ph-control">
        <div class="logo-wrap" style="margin-bottom:16px">
            <img src="https://z-cdn-media.chatglm.cn/files/ab46995c-be54-4f0c-97d9-dc9965e3150b.png?auth_key=1881547846-5faaad2376f94647ae1522c3a0360a5e-0-48bb8eb6d9136f1963f04a687018a6a3" alt="RedKick" style="width:40px;height:40px;border-radius:10px;box-shadow:0 0 20px rgba(255,45,45,0.2)">
        </div>
        <div class="account-bar">
            <div class="name">
                <span class="dot" id="statusDot"></span>
                <span id="accName">---</span>
                <span class="mode-badge" id="modeBadge"></span>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i> خروج</button>
        </div>
        <div class="proxy-bar" id="proxyBarCtrl">
            <span class="dot-proxy" id="proxyDotCtrl"></span>
            <span id="proxyLabelCtrl">---</span>
        </div>
        <div class="field">
            <label><i class="fas fa-hashtag" style="color:var(--accent);margin-left:4px;font-size:11px"></i> اسم القناة</label>
            <input type="text" id="inChannel" placeholder="مثال: xqc">
            <p class="hint">الاسم من الرابط: kick.com/<span style="color:var(--accent)">الاسم</span></p>
        </div>
        <div class="field">
            <label><i class="fas fa-comment-dots" style="color:var(--accent);margin-left:4px;font-size:11px"></i> الرسائل</label>
            <textarea id="inMessages" placeholder="رسالة في كل سطر&#10;مرحبا&#10;كيف الحال&#10;شباب"></textarea>
            <p class="hint">كل سطر = رسالة منفصلة</p>
        </div>
        <div class="field">
            <label><i class="fas fa-repeat" style="color:var(--accent);margin-left:4px;font-size:11px"></i> عدد التكرار</label>
            <div class="row" style="align-items:center">
                <input type="number" id="inRepeat" value="1" min="0" style="max-width:100px" oninput="onRepeatChange()">
                <button class="btn btn-ghost btn-sm" id="btnInfinite" onclick="toggleInfinite()" style="font-size:12px;padding:8px 14px"><i class="fas fa-infinity"></i> لا نهاية</button>
            </div>
            <p class="hint" id="repeatHint">0 = تكرار لا نهائي | كل دورة ترسل كل الأسطر</p>
        </div>
        <div class="field">
            <label><i class="fas fa-clock" style="color:var(--accent);margin-left:4px;font-size:11px"></i> الفاصل الزمني</label>
            <div class="row" style="align-items:center">
                <input type="number" id="inInterval" value="5" min="1" max="120" style="max-width:100px">
                <span style="color:var(--muted);font-size:12px">ثانية بين كل رسالة</span>
            </div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:18px">
            <button class="btn btn-fire btn-full" id="btnSend" onclick="startSending()"><i class="fas fa-paper-plane"></i> إرسال الرسائل</button>
            <button class="btn btn-stop btn-full" id="btnStop" onclick="stopSending()" style="display:none"><i class="fas fa-stop"></i> إيقاف</button>
        </div>
        <div class="progress-wrap" id="progWrap" style="display:none">
            <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
            <div class="progress-info"><span id="progCount">0/0</span><span id="progTime">--</span></div>
        </div>
        <div class="log-section">
            <div class="log" id="logBox" style="display:none"></div>
        </div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   RedKick — إعادة بناء كاملة مع دعم CORS Proxy
   جميع نقاط API محدثة وفقاً لأحدث هيكل Kick
   ═══════════════════════════════════════════════════════════ */

// ═══════════════════════════════════════
//  الإعدادات العامة
// ═══════════════════════════════════════
const KICK_BASE = 'https://kick.com';

// قائمة البروكسيات مع طريقة بناء الرابط
const PROXIES = [
    {
        name: 'cors.sh',
        build: function(url) { return 'https://cors.sh/' + url; }
    },
    {
        name: 'مباشر',
        build: function(url) { return url; }
    }
];

let activeProxy = 0;     // فهرس البروكسي النشط
let kickToken = '';       // Bearer token
let xsrfToken = '';       // رمز XSRF
let isSending = false;    // هل يتم الإرسال حالياً
let abortCtrl = null;     // للإلغاء
let proxyOk = false;      // هل البروكسيعمل؟
let isDirectMode = false;  // هل نعمل مباشرة على كيك؟

const $ = function(id) { return document.getElementById(id); };

// ═══════════════════════════════════════
//  كشف وضع التشغيل
// ═══════════════════════════════════════
function detectMode() {
    try {
        isDirectMode = window.location.hostname === 'kick.com' || window.location.hostname.endsWith('.kick.com');
    } catch(e) {
        isDirectMode = false;
    }

    if (isDirectMode) {
        // إذا كنا على كيك مباشرة، استخدم الوضع المباشر
        activeProxy = PROXIES.length - 1; // "مباشر"
    }
}

// ═══════════════════════════════════════
//  بناء رابط API عبر البروكسي
// ═══════════════════════════════════════
function apiUrl(path) {
    var fullUrl = KICK_BASE + path;
    return PROXIES[activeProxy].build(fullUrl);
}

// ═══════════════════════════════════════
//  طلب API مركزي مع إعادة المحاولة
// ═══════════════════════════════════════
async function kickFetch(path, options) {
    options = options || {};
    var method = options.method || 'GET';
    var body = options.body || null;
    var extraHeaders = options.headers || {};
    var skipAuth = options.skipAuth || false;
    var retryProxy = options.retryProxy !== false; // إعادة المحاولة مع بروكسي آخر

    var headers = {
        'Accept': 'application/json',
        'Content-Type': 'application/json',
        'Origin': KICK_BASE
    };

    // إضافة Authorization
    if (!skipAuth && kickToken) {
        headers['Authorization'] = 'Bearer ' + kickToken;
    }

    // إضافة XSRF
    if (xsrfToken) {
        headers['X-XSRF-TOKEN'] = xsrfToken;
    }

    // دمج headers إضافية
    for (var key in extraHeaders) {
        headers[key] = extraHeaders[key];
    }

    var fetchOptions = {
        method: method,
        headers: headers,
        credentials: isDirectMode ? 'include' : 'omit'
    };

    if (body && method !== 'GET') {
        fetchOptions.body = JSON.stringify(body);
    }

    var url = apiUrl(path);

    try {
        var response = await fetch(url, fetchOptions);
        return response;
    } catch (e) {
        // إذا فشل الطلب، جرب بروكسي آخر
        if (retryProxy && activeProxy < PROXIES.length - 1) {
            var oldProxy = activeProxy;
            activeProxy++;
            addLog('wr', 'فشل البروكسي (' + PROXIES[oldProxy].name + ')، جارٍ تجربة (' + PROXIES[activeProxy].name + ')...');
            updateProxyUI();
            try {
                var retryUrl = apiUrl(path);
                var retryResponse = await fetch(retryUrl, fetchOptions);
                return retryResponse;
            } catch (e2) {
                // أعده للبروكسي الأصلي
                activeProxy = oldProxy;
                updateProxyUI();
                throw e2;
            }
        }
        throw e;
    }
}

// ═══════════════════════════════════════
//  تبديل البروكسي يدوياً
// ═══════════════════════════════════════
function switchProxy() {
    var sel = $('proxySelect');
    activeProxy = parseInt(sel.value);
    updateProxyUI();
    addLog('in', 'تم تبديل البروكسي إلى: ' + PROXIES[activeProxy].name);
    // أعد فحص الاتصال
    testProxyConnection();
}

function updateProxyUI() {
    var dotToken = $('proxyDotToken');
    var dotCtrl = $('proxyDotCtrl');
    var labelToken = $('proxyLabelToken');
    var labelCtrl = $('proxyLabelCtrl');
    var badge = $('modeBadge');

    var proxyName = PROXIES[activeProxy].name;
    isDirectMode = activeProxy === PROXIES.length - 1;

    if (isDirectMode) {
        if (badge) { badge.className = 'mode-badge mode-direct'; badge.innerHTML = '<i class="fas fa-link"></i> مباشر'; }
        if (dotToken) { dotToken.className = 'dot-proxy ok'; }
        if (dotCtrl) { dotCtrl.className = 'dot-proxy ok'; }
        if (labelToken) labelToken.textContent = 'وضع مباشر (على كيك)';
        if (labelCtrl) labelCtrl.textContent = 'وضع مباشر (على كيك)';
    } else {
        if (badge) { badge.className = 'mode-badge mode-proxy'; badge.innerHTML = '<i class="fas fa-shield"></i> ' + proxyName; }
        if (dotToken) { dotToken.className = 'dot-proxy ' + (proxyOk ? 'ok' : 'fail'); }
        if (dotCtrl) { dotCtrl.className = 'dot-proxy ' + (proxyOk ? 'ok' : 'fail'); }
        if (labelToken) labelToken.textContent = proxyOk ? 'بروكسي: ' + proxyName + ' — متصل' : 'بروكسي: ' + proxyName + ' — غير متصل';
        if (labelCtrl) labelCtrl.textContent = proxyOk ? 'بروكسي: ' + proxyName + ' — متصل' : 'بروكسي: ' + proxyName + ' — غير متصل';
    }
}

// ═══════════════════════════════════════
//  فحص اتصال البروكسي
// ═══════════════════════════════════════
async function testProxyConnection() {
    var dotToken = $('proxyDotToken');
    if (dotToken) dotToken.className = 'dot-proxy wait';
    var labelToken = $('proxyLabelToken');
    if (labelToken) labelToken.textContent = 'جارٍ فحص الاتصال...';

    try {
        var res = await kickFetch('/api/v1/categories', { skipAuth: true, retryProxy: false });
        if (res.ok) {
            proxyOk = true;
        } else {
            // حتى لو رجع 401 أو 403، البروكسي يعمل
            proxyOk = res.status < 500;
        }
    } catch (e) {
        proxyOk = false;
    }

    updateProxyUI();
    return proxyOk;
}

// ═══════════════════════════════════════
//  عرض المراحل
// ═══════════════════════════════════════
function showPhase(name) {
    document.querySelectorAll('.phase').forEach(function(p) { p.classList.remove('active'); });
    $('ph-' + name).classList.add('active');
}

// ═══════════════════════════════════════
//  إشعارات Toast
// ═══════════════════════════════════════
function toast(msg, type) {
    var t = document.createElement('div');
    t.className = 'toast toast-' + (type || 'i');
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function() { t.remove(); }, 300); }, 3000);
}

var logCls = { ok: 'l-ok', er: 'l-er', 'in': 'l-in', wr: 'l-wr' };

function addLog(type, msg) {
    var box = $('logBox');
    var d = new Date();
    var ts = [d.getHours(), d.getMinutes(), d.getSeconds()].map(function(n) { return String(n).padStart(2, '0'); }).join(':');
    var el = document.createElement('div');
    el.className = 'log-entry ' + (logCls[type] || logCls['in']);
    var sp = document.createElement('span');
    sp.style.opacity = '0.4';
    sp.textContent = '[' + ts + '] ';
    el.appendChild(sp);
    el.appendChild(document.createTextNode(msg));
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
}

function clearLog() { $('logBox').innerHTML = ''; }

function escH(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ═══════════════════════════════════════
//  جسيمات نارية
// ═══════════════════════════════════════
(function() {
    var cv = $('fireCanvas'), ctx = cv.getContext('2d');
    var W, H; var embers = [], MAX = 55;
    function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    function spawn() {
        return { x: Math.random()*(W||800), y: (H||600)+10, vx: (Math.random()-.5)*.8, vy: -(Math.random()*1.5+.5), r: Math.random()*2.5+.5, life: Math.random()*200+100, ml: 0, hue: Math.random()*40 };
    }
    for (var i = 0; i < MAX; i++) { var e = spawn(); e.y = Math.random()*(H||600); e.life = Math.random()*200; e.ml = e.life; embers.push(e); }
    function draw() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < embers.length; i++) {
            var e = embers[i]; e.x += e.vx; e.y += e.vy; e.vx += (Math.random()-.5)*.1; e.life--;
            if (e.life <= 0 || e.y < -20) { embers[i] = spawn(); embers[i].ml = embers[i].life; continue; }
            var a = Math.max(0, e.life / (e.ml || 200)), r = Math.max(.1, e.r * a);
            var g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, Math.max(.1, r * 4));
            g.addColorStop(0, 'hsla(' + e.hue + ',100%,60%,' + (a * .6) + ')');
            g.addColorStop(.5, 'hsla(' + e.hue + ',100%,50%,' + (a * .15) + ')');
            g.addColorStop(1, 'hsla(' + e.hue + ',100%,40%,0)');
            ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(.1, r * 4), 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
            ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(.1, r), 0, Math.PI * 2); ctx.fillStyle = 'hsla(' + e.hue + ',100%,70%,' + (a * .9) + ')'; ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) draw();
})();

// ═══════════════════════════════════════
//  جلب رمز XSRF
// ═══════════════════════════════════════
async function fetchXsrf() {
    xsrfToken = '';

    // الطريقة 1: من صفحة كيك الرئيسية (عبر البروكسي)
    try {
        var url = apiUrl('/');
        var res = await fetch(url, {
            headers: { 'Accept': 'text/html', 'Origin': KICK_BASE }
        });
        if (res.ok) {
            var html = await res.text();
            // البحث في meta tags
            var m;
            m = html.match(/<meta[^>]*name=["']csrf-token["'][^>]*content=["']([^"']+)["']/i);
            if (m) { xsrfToken = m[1]; return; }
            m = html.match(/<meta[^>]*content=["']([^"']+)["'][^>]*name=["']csrf-token["']/i);
            if (m) { xsrfToken = m[1]; return; }
            // البحث في JSON
            m = html.match(/"csrf[^"]*"\s*:\s*"([^"]+)"/i);
            if (m) { xsrfToken = m[1]; return; }
            // البحث عن token في أي سكريبت
            m = html.match(/xsrf[^"]*["']\s*:\s*["']([^"']+)["']/i);
            if (m) { xsrfToken = m[1]; return; }
        }
    } catch(e) {}

    // الطريقة 2: من sanctum/csrf-cookie
    try {
        var csrfUrl = apiUrl('/sanctum/csrf-cookie');
        await fetch(csrfUrl, {
            credentials: isDirectMode ? 'include' : 'omit',
            headers: { 'Accept': 'application/json', 'Origin': KICK_BASE }
        });
        if (isDirectMode) {
            var cm = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            if (cm) { xsrfToken = decodeURIComponent(cm[1]); return; }
        }
    } catch(e) {}

    // الطريقة 3: من توكن المستخدم (بعض الإصدارات تستخدم التوكن نفسه)
    // سنحاول بدون XSRF أولاً، ونعالج خطأ 419 لاحقاً
}

// ═══════════════════════════════════════
//  تجديد XSRF بصمت
// ═══════════════════════════════════════
async function refreshXsrf() {
    xsrfToken = '';
    await fetchXsrf();
    if (xsrfToken) {
        addLog('in', 'تم تجديد XSRF بنجاح');
    } else {
        addLog('wr', 'لم يتم العثور على XSRF — سيتم المحاولة بدونه');
    }
}

// ═══════════════════════════════════════
//  تهيئة الجلسة
// ═══════════════════════════════════════
async function initSession() {
    showPhase('load');

    // كشف وضع التشغيل
    detectMode();

    // فحص البروكسي
    await testProxyConnection();

    // جلب XSRF
    if (!isDirectMode) {
        addLog('in', 'جارٍ جلب رمز الحماية XSRF...');
        await fetchXsrf();
        if (xsrfToken) {
            addLog('ok', 'تم الحصول على XSRF');
        } else {
            addLog('wr', 'لم يتم الحصول على XSRF — قد تحتاجه لبعض العمليات');
        }
    } else {
        // في الوضع المباشر، جلب XSRF من الكوكيز
        try {
            var cm = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            if (cm) xsrfToken = decodeURIComponent(cm[1]);
        } catch(e) {}
    }

    showPhase('token');
}

// ═══════════════════════════════════════
//  فحص التوكن
// ═══════════════════════════════════════
async function verifyToken() {
    var token = $('inToken').value.trim();
    if (!token) { toast('أدخل التوكن', 'e'); return; }

    // إزالة "Bearer " إذا كان موجوداً
    if (token.toLowerCase().startsWith('bearer ')) {
        token = token.substring(7).trim();
    }

    var btn = $('btnVerify');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span>';

    try {
        // تجربة api/v1/user أولاً
        var res = null;
        var errorMsg = '';

        try {
            res = await kickFetch('/api/v1/user', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
        } catch(e) {
            errorMsg = e.message;
        }

        // إذا فشل، جرب v2
        if (!res || !res.ok) {
            try {
                res = await kickFetch('/api/v2/user', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
            } catch(e) {}
        }

        if (!res) {
            throw new Error('فشل الاتصال — تحقق من البروكسي والإنترنت');
        }

        if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
                var errBody = '';
                try { errBody = await res.text(); } catch(e) {}
                throw new Error('التوكن غير صالح أو منتهي' + (res.status === 403 ? ' (403)' : ''));
            }
            throw new Error('خطأ HTTP: ' + res.status);
        }

        var raw = await res.text();
        var data;
        try { data = JSON.parse(raw); } catch(e) { throw new Error('الخادم لم يُرجع بيانات صالحة'); }

        // البحث عن اسم المستخدم في كل الهياكل المحتملة
        var username =
            data.username ||
            data.user?.username ||
            data.data?.username ||
            data.data?.user?.username ||
            data.slug ||
            data.name ||
            null;

        if (!username && !data.id && !data.data?.id) {
            throw new Error('لم يتم العثور على بيانات الحساب — تأكد من صحة التوكن');
        }

        kickToken = token;
        var displayName = username || ('حساب #' + (data.id || data.user?.id || data.data?.id || '?'));

        $('accName').textContent = displayName;
        $('tokenStatus').innerHTML = '<span style="color:var(--success)"><i class="fas fa-check-circle"></i> مرحباً ' + escH(displayName) + '</span>';
        toast('تم التحقق — ' + displayName, 's');

        setTimeout(function() {
            showPhase('control');
            addLog('ok', 'تم تسجيل الدخول — ' + displayName);
            updateProxyUI();
        }, 600);

    } catch (e) {
        $('tokenStatus').innerHTML = '<span style="color:var(--danger)"><i class="fas fa-xmark-circle"></i> ' + escH(e.message) + '</span>';
        toast(e.message, 'e');
        addLog('er', 'فشل التحقق: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-shield-halved"></i> فحص';
    }
}

// ═══════════════════════════════════════
//  جلب معلومات القناة — مع تجربة عدة نقاط
// ═══════════════════════════════════════
async function fetchChannel(slug) {
    var endpoints = [
        '/api/v2/channels/' + slug,
        '/api/v1/channels/' + slug
    ];

    for (var i = 0; i < endpoints.length; i++) {
        try {
            var res = await kickFetch(endpoints[i], { skipAuth: true });
            if (res.ok) {
                var data = await res.json();
                addLog('in', 'تم جلب بيانات القناة من ' + endpoints[i]);
                return data;
            }
        } catch(e) {
            addLog('wr', 'فشل ' + endpoints[i] + ': ' + e.message);
        }
    }

    throw new Error('القناة غير موجودة أو فشل الاتصال');
}

// ═══════════════════════════════════════
//  استخراج chatroom_id من بيانات القناة
// ═══════════════════════════════════════
function extractChatroomId(ch) {
    // هيكل v1: { chatroom_id: 123 } أو { chatroom: { id: 123 } }
    // هيكل v2: { data: { chatroom: { id: 123 } } }
    var data = ch.data || ch;

    if (data.chatroom_id) return data.chatroom_id;
    if (data.chatroom) {
        if (typeof data.chatroom === 'object') return data.chatroom.id;
        return data.chatroom;
    }

    // محاولة إضافية من chatroom endpoint
    return null;
}

// ═══════════════════════════════════════
//  جلب chatroom_id إضافي
// ═══════════════════════════════════════
async function fetchChatroomId(slug) {
    try {
        var res = await kickFetch('/api/v2/channels/' + slug + '/chatroom', { skipAuth: true });
        if (res.ok) {
            var data = await res.json();
            var d = data.data || data;
            return d.id || d.chatroom_id || null;
        }
    } catch(e) {}

    try {
        var res2 = await kickFetch('/api/v1/' + slug + '/chatroom', { skipAuth: true });
        if (res2.ok) {
            var data2 = await res2.json();
            return data2.id || data2.chatroom_id || null;
        }
    } catch(e) {}

    return null;
}

// ═══════════════════════════════════════
//  إرسال رسالة واحدة — مع تجربة عدة نقاط
// ═══════════════════════════════════════
async function sendMessage(chatroomId, content, retryInfo) {
    retryInfo = retryInfo || { attempt: 0, refreshedXsrf: false };

    var headers = {
        'Authorization': 'Bearer ' + kickToken
    };

    if (xsrfToken) {
        headers['X-XSRF-TOKEN'] = xsrfToken;
    }

    // الطريقة 1: POST api/v2/messages/send/{chatroomId}
    if (retryInfo.attempt === 0) {
        try {
            var v2Url = apiUrl('/api/v2/messages/send/' + chatroomId);
            var v2Res = await fetch(v2Url, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'Origin': KICK_BASE,
                    'Authorization': 'Bearer ' + kickToken,
                    'X-XSRF-TOKEN': xsrfToken || ''
                },
                credentials: isDirectMode ? 'include' : 'omit',
                body: JSON.stringify({ content: content, type: 'message' })
            });

            if (v2Res.ok) {
                return true;
            }

            // خطأ 419 = XSRF منتهي
            if (v2Res.status === 419 && !retryInfo.refreshedXsrf) {
                await refreshXsrf();
                retryInfo.refreshedXsrf = true;
                retryInfo.attempt = 1;
                return sendMessage(chatroomId, content, retryInfo);
            }

            // خطأ حرج
            if (v2Res.status === 429) throw new Error('حظر مؤقت — أبطئ الإرسال');
            if (v2Res.status === 403) throw new Error('لا صلاحية للكتابة هنا');
            if (v2Res.status === 401) throw new Error('التوكن منتهي — أعد الدخول');

            // إذا فشل v2، جرب v1
            addLog('wr', 'v2/messages/send فشل (' + v2Res.status + ')، جارٍ تجربة v1...');
        } catch(e) {
            if (e.message.indexOf('حظر') >= 0 || e.message.indexOf('صلاحية') >= 0 || e.message.indexOf('منتهي') >= 0) {
                throw e;
            }
            addLog('wr', 'v2 فشل: ' + e.message + '، جارٍ تجربة v1...');
        }
    }

    // الطريقة 2: POST api/v1/chat-messages
    try {
        var v1Url = apiUrl('/api/v1/chat-messages');
        var v1Res = await fetch(v1Url, {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                'Origin': KICK_BASE,
                'Authorization': 'Bearer ' + kickToken,
                'X-XSRF-TOKEN': xsrfToken || ''
            },
            credentials: isDirectMode ? 'include' : 'omit',
            body: JSON.stringify({
                content: content,
                chatroom_id: parseInt(chatroomId)
            })
        });

        if (v1Res.ok) {
            return true;
        }

        // خطأ 419 = XSRF منتهي
        if (v1Res.status === 419 && !retryInfo.refreshedXsrf) {
            await refreshXsrf();
            retryInfo.refreshedXsrf = true;
            return sendMessage(chatroomId, content, retryInfo);
        }

        if (v1Res.status === 429) throw new Error('حظر مؤقت — أبطئ الإرسال');
        if (v1Res.status === 403) throw new Error('لا صلاحية للكتابة هنا');
        if (v1Res.status === 401) throw new Error('التوكن منتهي — أعد الدخول');
        if (v1Res.status === 419) throw new Error('فشل رمز الحماية XSRF');

        var errDetail = '';
        try { errDetail = await v1Res.text(); } catch(e) {}
        throw new Error('فشل (' + v1Res.status + ')' + (errDetail ? ' — ' + errDetail.substring(0, 100) : ''));
    } catch(e) {
        if (e.message.indexOf('حظر') >= 0 || e.message.indexOf('صلاحية') >= 0 || e.message.indexOf('منتهي') >= 0) {
            throw e;
        }
        // خطأ شبكة
        if (e instanceof TypeError || e.message.indexOf('Failed to fetch') >= 0) {
            throw new Error('خطأ اتصال — تأكد من الإنترنت والبروكسي');
        }
        throw e;
    }
}

// ═══════════════════════════════════════
//  بدء الإرسال — نظام التكرار والدورات
// ═══════════════════════════════════════
async function startSending() {
    var slug = $('inChannel').value.trim();
    var raw = $('inMessages').value.trim();
    var interval = Math.max(1, parseInt($('inInterval').value) || 5);
    var repeatVal = parseInt($('inRepeat').value) || 0;
    var infinite = isInfinite || repeatVal === 0;
    var repeatCount = infinite ? 999999 : Math.max(1, repeatVal);

    if (!slug) { toast('أدخل اسم القناة', 'e'); return; }
    if (!raw) { toast('أدخل رسالة واحدة على الأقل', 'e'); return; }

    var msgs = raw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
    if (!msgs.length) { toast('لا توجد رسائل', 'e'); return; }

    isSending = true;
    abortCtrl = new AbortController();

    $('btnSend').style.display = 'none';
    $('btnStop').style.display = '';
    $('progWrap').style.display = '';
    $('statusDot').classList.add('dot-sending');

    var modeText = infinite ? 'لا نهائي' : repeatCount + ' دورة';
    addLog('in', 'بدء الإرسال — ' + msgs.length + ' رسالة × ' + modeText + ' → "' + slug + '" (فاصل: ' + interval + 'ث)');

    try {
        // جلب بيانات القناة
        var ch = await fetchChannel(slug);

        var cid = extractChatroomId(ch);
        if (!cid) {
            cid = await fetchChatroomId(slug);
        }
        if (!cid) {
            throw new Error('لم يتم العثور على معرف الدردشة — تأكد من اسم القناة');
        }

        var channelName = ch.name || ch.data?.name || ch.data?.user?.username || slug;
        addLog('ok', 'القناة: ' + channelName + ' — chatroom_id: ' + cid);

        var sent = 0;
        var failCount = 0;
        var MAX_FAILS = 3;
        var msgIndex = 0;       // مؤشر الرسالة الحالية داخل القائمة
        var roundNum = 0;       // رقم الدورة الحالية
        var totalInRound = msgs.length; // عدد الرسائل في كل دورة

        // حلقة الإرسال: تدور على الرسائل وتكررها
        while (isSending) {
            // تحقق من عدد الدورات
            if (!infinite && roundNum >= repeatCount) break;

            var currentMsg = msgs[msgIndex % msgs.length];

            try {
                await sendMessage(cid, currentMsg);
                sent++;
                failCount = 0;
                addLog('ok', '[' + sent + '] ' + currentMsg.substring(0, 60));
            } catch (e) {
                failCount++;
                addLog('er', '[' + (sent + 1) + '] ' + e.message);

                if (e.message.indexOf('حظر') >= 0 || e.message.indexOf('صلاحية') >= 0 || e.message.indexOf('منتهي') >= 0) {
                    addLog('er', 'خطأ حرج — تم الإيقاف');
                    break;
                }

                if (failCount >= MAX_FAILS) {
                    addLog('er', 'فشل ' + MAX_FAILS + ' مرات متتالية — تم الإيقاف');
                    break;
                }
            }

            // تحديث شريط التقدم
            msgIndex++;
            if (msgIndex % totalInRound === 0) {
                roundNum++;
            }

            if (infinite) {
                $('progFill').style.width = '100%';
                $('progFill').style.background = 'linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent))';
                $('progFill').style.backgroundSize = '200% 100%';
                $('progFill').style.animation = 'shimmer 2s linear infinite';
                $('progCount').textContent = 'الدورة ' + roundNum + ' | ' + sent + ' رسالة';
                $('progTime').textContent = msgs.length + ' رسالة/دورة';
            } else {
                var totalMsgs = repeatCount * totalInRound;
                var pct = Math.min(100, (sent / totalMsgs) * 100);
                $('progFill').style.width = pct + '%';
                $('progFill').style.background = '';
                $('progFill').style.backgroundSize = '';
                $('progFill').style.animation = '';
                $('progCount').textContent = sent + ' / ' + totalMsgs + ' (دورة ' + Math.min(roundNum + 1, repeatCount) + '/' + repeatCount + ')';
                var remaining = (totalMsgs - sent) * interval;
                var mm = Math.floor(remaining / 60), ss = remaining % 60;
                $('progTime').textContent = mm > 0 ? '~' + mm + 'د ' + ss + 'ث' : '~' + ss + ' ثانية';
            }

            // انتظر الفاصل الزمني
            if (isSending) {
                await delay(interval * 1000, abortCtrl.signal);
            }
        }

        if (!isSending) {
            toast('تم الإيقاف — ' + sent + ' رسالة أُرسلت', 'i');
        } else if (sent > 0) {
            toast('اكتمل — ' + sent + ' رسالة', 's');
        }

    } catch (e) {
        var msg = e.message;
        if (e instanceof TypeError || e.message.indexOf('Failed to fetch') >= 0) {
            msg = 'خطأ اتصال — تأكد من الإنترنت والبروكسي';
        }
        toast('خطأ: ' + msg, 'e');
    } finally {
        isSending = false; abortCtrl = null;
        $('btnSend').style.display = ''; $('btnStop').style.display = 'none';
        $('statusDot').classList.remove('dot-sending');
        // إعادة شريط التقدم لحالته الطبيعية
        $('progFill').style.background = '';
        $('progFill').style.backgroundSize = '';
        $('progFill').style.animation = '';
    }
}

function stopSending() {
    isSending = false;
    if (abortCtrl) abortCtrl.abort();
    toast('جارٍ الإيقاف...', 'i');
}

function delay(ms, signal) {
    return new Promise(function(resolve, reject) {
        if (signal && signal.aborted) { reject(new Error('aborted')); return; }
        var t = setTimeout(resolve, ms);
        if (signal) signal.addEventListener('abort', function() { clearTimeout(t); reject(new Error('aborted')); }, { once: true });
    });
}

function logout() {
    if (isSending) stopSending();
    kickToken = ''; xsrfToken = '';
    isInfinite = false;
    $('inToken').value = ''; $('tokenStatus').innerHTML = '';
    $('inChannel').value = ''; $('inMessages').value = ''; $('inInterval').value = '5';
    $('inRepeat').value = '1'; $('inRepeat').disabled = false;
    $('btnInfinite').style.background = ''; $('btnInfinite').style.color = ''; $('btnInfinite').style.borderColor = '';
    $('repeatHint').textContent = '0 = تكرار لا نهائي | كل دورة ترسل كل الأسطر';
    $('progFill').style.width = '0'; $('progFill').style.background = ''; $('progFill').style.backgroundSize = ''; $('progFill').style.animation = '';
    $('progWrap').style.display = 'none';
    clearLog(); showPhase('token'); toast('تم تسجيل الخروج', 'i');
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement.id === 'inToken' && !e.shiftKey) { e.preventDefault(); verifyToken(); }
});

// ═══════════════════════════════════════
//  بدء التشغيل
// ═══════════════════════════════════════
initSession();
</script>
