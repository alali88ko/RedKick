
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedKick - صيانة</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Tahoma, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    padding:20px;
}

.logo{
    width:180px;
    height:180px;
    object-fit:contain;
    margin-bottom:25px;
}

h1{
    color:#ff1f1f;
    font-size:48px;
    margin-bottom:15px;
}

p{
    color:#cfcfcf;
    font-size:20px;
    line-height:1.8;
}

.loader{
    width:50px;
    height:50px;
    border:4px solid #333;
    border-top:4px solid #ff1f1f;
    border-radius:50%;
    margin:25px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="container">
    <img src="logo.png" alt="RedKick Logo" class="logo">

    <h1>RedKick</h1>

    <div class="loader"></div>

    <p>
        الموقع تحت الصيانة حالياً.<br>
        نعمل على تحسين الخدمات وإضافة مزايا جديدة.<br>
        سنعود قريباً.
    </p>
</div>

</body>
</html>
