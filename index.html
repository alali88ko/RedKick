<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* الموقع الحقيقي */
        .site-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* زر التفاعل العائم */
        .interact-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: #53fc18;
            color: #000;
            font-size: 26px; /* حجم الصاعقة */
            font-weight: 700;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.1;
            box-shadow: 0 4px 20px rgba(83, 252, 24, 0.4);
            transition: box-shadow 0.2s;
            touch-action: none; /* ضروري لسلاسة السحب على الهاتف */
            user-select: none;
        }

        .interact-btn:active {
            box-shadow: 0 6px 28px rgba(83, 252, 24, 0.6);
        }

        /* لوحة التحكم */
        .control-panel {
            position: fixed;
            bottom: 95px;
            right: 15px;
            width: 320px;
            max-width: calc(100vw - 30px);
            background: #18181b;
            border: 1px solid #2f2f35;
            border-radius: 12px;
            padding: 16px;
            z-index: 9998;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .control-panel.open {
            display: block;
        }

        .panel-title {
            color: #53fc18;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            color: #adadb8;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group select, 
        .form-group input, 
        .form-group textarea {
            width: 100%;
            background: #323239;
            border: 1px solid #2f2f35;
            color: #efeff1;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-family: sans-serif;
        }

        .form-group select:focus, 
        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #53fc18;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-start {
            flex: 1;
            padding: 10px;
            background: #53fc18;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-stop {
            flex: 1;
            padding: 10px;
            background: #eb0400;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }

        /* سجل التشغيل */
        .log-area {
            margin-top: 12px;
            background: #0e0e10;
            border-radius: 6px;
            padding: 8px;
            height: 100px;
            overflow-y: auto;
            font-size: 11px;
            color: #adadb8;
            border: 1px solid #2f2f35;
        }

        .log-area .log-success { color: #53fc18; }
        .log-area .log-wait { color: #f59e0b; }
    </style>
</head>
<body>

    <iframe class="site-frame" src="https://kick.com" allow="autoplay; fullscreen; clipboard-write" allowfullscreen></iframe>

    <!-- زر الصاعقة العائم -->
    <button class="interact-btn" id="floatBtn">⚡</button>

    <!-- لوحة التحكم بالتفاعل -->
    <div class="control-panel" id="controlPanel">
        <div class="panel-title">⚡ لوحة التفاعل</div>

        <div class="form-group">
            <label>اختر القناة</label>
            <select id="channelSelect">
                <option value="xqc">xQc</option>
                <option value="ninja">Ninja</option>
                <option value="hasanabi">HasanAbi</option>
                <option value="amouranth">Amouranth</option>
                <option value="custom">-- كتابة يدوية --</option>
            </select>
        </div>

        <div class="form-group" id="customChannelGroup" style="display: none;">
            <label>اسم القناة</label>
            <input type="text" id="customChannelInput" placeholder="أدخل اسم القناة هنا...">
        </div>

        <div class="form-group">
            <label>الرسائل (رسالة في كل سطر)</label>
            <textarea id="messagesInput" placeholder="مرحبا بالجميع&#10;كيف حالكم؟&#10;بث رائع!"></textarea>
        </div>

        <div class="form-group">
            <label>مؤقت التهدئة (بالثواني)</label>
            <input type="number" id="cooldownInput" value="5" min="1">
        </div>

        <div class="btn-group">
            <button class="btn-start" id="startBtn" onclick="startInteraction()">تشغيل</button>
            <button class="btn-stop" id="stopBtn" onclick="stopInteraction()">إيقاف</button>
        </div>

        <div class="log-area" id="logArea">
            <div>سجل التشغيل جاهز...</div>
        </div>
    </div>

    <script>
        // === 1. برمجة الزر العائم (السحب والنقر) ===
        const floatBtn = document.getElementById('floatBtn');
        const panel = document.getElementById('controlPanel');
        
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;
        let hasMoved = false;

        floatBtn.addEventListener('touchstart', (e) => {
            isDragging = true;
            hasMoved = false;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            
            const rect = floatBtn.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            floatBtn.style.right = 'auto';
            floatBtn.style.bottom = 'auto';
            floatBtn.style.left = initialLeft + 'px';
            floatBtn.style.top = initialTop + 'px';
        });

        floatBtn.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); 
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            if (Math.abs(currentX - startX) > 5 || Math.abs(currentY - startY) > 5) {
                hasMoved = true;
            }

            let newLeft = initialLeft + (currentX - startX);
            let newTop = initialTop + (currentY - startY);

            const maxLeft = window.innerWidth - floatBtn.offsetWidth;
            const maxTop = window.innerHeight - floatBtn.offsetHeight;

            newLeft = Math.max(0, Math.min(newLeft, maxLeft));
            newTop = Math.max(0, Math.min(newTop, maxTop));

            floatBtn.style.left = newLeft + 'px';
            floatBtn.style.top = newTop + 'px';
        });

        floatBtn.addEventListener('touchend', () => {
            isDragging = false;
            if (!hasMoved) {
                panel.classList.toggle('open');
            }
        });

        // === 2. إظهار/إخفاء حقل القناة اليدوية ===
        const channelSelect = document.getElementById('channelSelect');
        const customChannelGroup = document.getElementById('customChannelGroup');

        channelSelect.addEventListener('change', () => {
            if (channelSelect.value === 'custom') {
                customChannelGroup.style.display = 'block';
            } else {
                customChannelGroup.style.display = 'none';
            }
        });

        // === 3. منطق الإرسال ومؤقت التهدئة ===
        let interactionInterval = null;
        let messageArray = [];
        let currentMsgIndex = 0;
        const logArea = document.getElementById('logArea');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        function addLog(message, type = '') {
            const div = document.createElement('div');
            div.className = type;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${message}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function startInteraction() {
            const channel = channelSelect.value === 'custom' ? 
                document.getElementById('customChannelInput').value.trim() : 
                channelSelect.options[channelSelect.selectedIndex].text;
                
            const messages = document.getElementById('messagesInput').value.trim();
            const cooldown = parseInt(document.getElementById('cooldownInput').value);

            if (!channel || (channelSelect.value === 'custom' && !document.getElementById('customChannelInput').value.trim())) {
                addLog('خطأ: الرجاء اختيار أو كتابة اسم قناة!', 'log-wait');
                return;
            }
            if (!messages) {
                addLog('خطأ: الرجاء كتابة رسالة واحدة على الأقل!', 'log-wait');
                return;
            }

            messageArray = messages.split('\n').filter(msg => msg.trim() !== '');
            currentMsgIndex = 0;

            addLog(`بدء التفاعل في: ${channel}`, 'log-success');
            addLog(`عدد الرسائل: ${messageArray.length} | التهدئة: ${cooldown} ثانية`, 'log-success');

            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';

            sendMockMessage(channel);

            interactionInterval = setInterval(() => {
                sendMockMessage(channel);
            }, cooldown * 1000);
        }

        function sendMockMessage(channel) {
            if (currentMsgIndex >= messageArray.length) {
                currentMsgIndex = 0;
            }
            const msg = messageArray[currentMsgIndex];
            addLog(`إرسال إلى [${channel}]: ${msg}`);
            currentMsgIndex++;
        }

        function stopInteraction() {
            clearInterval(interactionInterval);
            interactionInterval = null;
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            addLog('تم إيقاف التفاعل.', 'log-wait');
        }
    </script>
</body>
</html>
